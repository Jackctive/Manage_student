<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh Sách Sinh Viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Danh Sách Sinh Viên</h2>
        <table class="table table-bordered table-striped mt-3">
            <thead class="table-dark">
                <tr>
                    <th>MSSV</th>
                    <th>Họ Tên</th>
                    <th>Ngày Sinh</th>
                    <th>Email</th>
                    <th>Số Điện Thoại</th>
                    <th>Lớp</th>
                    <th>Ngành Học</th>
                </tr>
            </thead>
            <tbody>
                {% for sv in sinhviens %}
                <tr>
                    <td>{{ sv.mssv }}</td>
                    <td>{{ sv.ho_ten }}</td>
                    <td>{{ sv.ngay_sinh }}</td>
                    <td>{{ sv.email }}</td>
                    <td>{{ sv.so_dien_thoai }}</td>
                    <td>{{ sv.lop }}</td>
                    <td>{{ sv.nganh_hoc }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="7" class="text-center">Không có sinh viên nào</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
