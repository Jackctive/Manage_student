<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm Sinh Viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Thêm Sinh Viên</h2>
        <form method="post">
            {% csrf_token %}
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">MSSV</label>
                    <input type="text" name="mssv" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Họ Tên</label>
                    <input type="text" name="ho_ten" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Ngày Sinh</label>
                    <input type="date" name="ngay_sinh" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Số Điện Thoại</label>
                    <input type="text" name="so_dien_thoai" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Lớp</label>
                    <input type="text" name="lop" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Ngành Học</label>
                    <input type="text" name="nganh_hoc" class="form-control" required>
                </div>
            </div>

            <!-- Hàng chứa nút "Thêm" và "Hủy" -->
            <div class="row">
                <div class="col-md-12 d-flex justify-content-center">
                    <button type="submit" class="btn btn-primary me-3">Thêm</button>
                    <a href="{% url 'ds_sv' %}" class="btn btn-secondary">Hủy</a>
                </div>
            </div>

        </form>
    </div>
</body>
</html>
